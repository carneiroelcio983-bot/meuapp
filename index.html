<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajudante do Eletricista</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #fff; }
    .card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
    button { background: #eab308; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h2>⚡ Ajudante do Eletricista</h2>

  <div class="card">
    <h3>Lei de Ohm (Potência W = V × A)</h3>
    <input type="number" id="tensao" placeholder="Tensão (Volts, ex: 127 ou 220)">
    <input type="number" id="corrente" placeholder="Corrente (Ampères)">
    <button onclick="calcularPotencia()">Calcular Potência</button>
    <p id="resultado"></p>
  </div>

  <script>
    function calcularPotencia() {
      const v = parseFloat(document.getElementById('tensao').value);
      const i = parseFloat(document.getElementById('corrente').value);
      if (v && i) {
        document.getElementById('resultado').innerText = `Potência: ${v * i} Watts`;
      } else {
        document.getElementById('resultado').innerText = 'Preencha os campos!';
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
